# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

parser: numpy
dynamic: true

display_name: perfinpy
repo: https://github.com/mjfrigaard/perfinpy
site_url: https://mjfrigaard.github.io/perfinpy/
pypi: false

authors:
  - name: Martin Frigaard
    role: Author
    email: mjfrigaard@pm.me

# no generated agent skill files in the site
skill:
  enabled: false

changelog:
  enabled: false

# User guide pages are discovered from user_guide/ (numbered files, grouped
# by the `guide-section` key in each page's front matter).

# API reference: one section per book chapter, in book order
reference:
  - title: Income
    desc: Foundations. Functions from the Income chapter.
    contents:
      - wealth_formula
      - fixed_cost_ratio
      - raise_invested_value
  - title: Tracking Spending
    desc: Foundations. Functions from the Tracking Spending chapter.
    contents:
      - apply_rules
      - subscription_opportunity_cost
  - title: Budgeting
    desc: Foundations. Functions from the Budgeting chapter.
    contents:
      - percent_of_income
      - to_annual
      - to_monthly
      - opportunity_cost
      - months_to_break_even
  - title: Managing Debt
